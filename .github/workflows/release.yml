name: Tagged release
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['.github/release-version']
permissions:
  contents: write
concurrency:
  group: wool2string-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/build.py
      - name: Resolve release version and validate notes
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(cat .github/release-version)"
          fi
          python scripts/release_notes.py "$tag" > "$RUNNER_TEMP/release-notes.md"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Wool2String $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            existing="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG")"
            if [ -n "$existing" ]; then
              echo "Release tag already exists; use the tagged release workflow instead."
              exit 1
            fi
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "Wool2String $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
